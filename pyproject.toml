[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Retained as the PyPI compatibility identifier; the repository and primary CLI are Human Agency Evals.
name = "autonomy-evals"
version = "0.1.0"
description = "Behavioral evaluation of whether AI assistants preserve human agency"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6", "numpy>=1.26,<2.3", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14", "matplotlib>=3.8", "inspect-ai>=0.3.100"]

[project.optional-dependencies]
providers = ["openai>=1.0", "anthropic>=0.40", "google-genai>=1.0"]
local = ["transformers>=4.45", "torch>=2.3", "accelerate>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14", "pandas-stubs", "types-PyYAML"]

[project.scripts]
human-agency-evals = "human_agency_evals.cli:main"
# Compatibility alias retained for existing scripts; prefer `human-agency-evals`.
autonomy-evals = "human_agency_evals.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/human_agency_evals"]
